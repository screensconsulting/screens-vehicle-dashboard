# ══════════════════════════════════════════════════════════════════
# Screens Studio — Weekly Dashboard Auto-Update
# ══════════════════════════════════════════════════════════════════
# Triggers:
#   • Every Monday at 07:00 UTC (automatically)
#   • Manually via GitHub Actions "Run workflow" button
#
# What it does:
#   1. Checks out the repository
#   2. Runs update_dashboard.py (reads Excel + fetches web data)
#   3. Commits any changes to dashboard.html
#   4. Deploys to GitHub Pages (the live URL)
#
# First-time setup:
#   1. Push this repo to GitHub (private repo is fine, Pages still works)
#   2. In GitHub repo Settings → Pages → Source: "GitHub Actions"
#   3. That's it — the workflow runs automatically every Monday
# ══════════════════════════════════════════════════════════════════

name: Weekly Dashboard Update

on:
  schedule:
    # Every Monday at 07:00 UTC
    - cron: "0 7 * * 1"
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Python setup ────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install openpyxl requests beautifulsoup4

      # ── Run the updater ─────────────────────────────────────────
      - name: Run dashboard updater
        run: python update_dashboard.py

      # ── Commit changes to dashboard.html ─────────────────────
      - name: Commit updated dashboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard.html update_log.txt || true
          git diff --staged --quiet || git commit -m "chore: auto-update dashboard $(date -u +%Y-%m-%d)"
          git push

      # ── Deploy to GitHub Pages ───────────────────────────────
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."   # deploy entire folder (dashboard.html at root)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
